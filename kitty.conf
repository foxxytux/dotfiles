# --- Fonts ---
# Using 13.0 as requested for that perfect balance of density and readability
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
disable_ligatures never

# --- Transparency & Aesthetics ---
background_opacity         0.7
dynamic_background_opacity yes
window_padding_width       10
placement_strategy         center

# --- Window Decorations (Restored) ---
# Setting this to "no" brings back the OS title bar and borders
hide_window_decorations    no
window_border_width        1.0pt
draw_minimal_borders       yes
active_border_color        #00ff00
inactive_border_color      #cccccc
confirm_os_window_close    0

# --- Cursor ---
cursor_shape               block
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0
shell_integration          enabled

# --- Scrollback ---
scrollback_lines           10000
wheel_scroll_multiplier    5.0
touch_scroll_multiplier    1.0

# --- Mouse ---
mouse_hide_wait             3.0
url_color                   #0087bd
url_style                   curly
open_url_with               default
detect_urls                 yes
copy_on_select              yes
strip_trailing_spaces       smart
focus_follows_mouse         yes
pointer_shape_when_grabbed  arrow

# --- Performance & Bell ---
repaint_delay    10
input_delay      3
sync_to_monitor  yes
enable_audio_bell no
window_alert_on_bell yes

# --- Tab Bar Aesthetics ---
tab_bar_edge              top
tab_bar_margin_width      0.0
tab_bar_style             powerline
tab_powerline_style       slanted
active_tab_font_style     bold
inactive_tab_font_style   normal
tab_title_template        "{index}: {title}"

# --- Layouts ---
enabled_layouts           splits,stack,grid

# --- Keyboard Shortcuts (QOL) ---
# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Tab Management
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Window/Splits Management
map ctrl+shift+enter new_window
map ctrl+shift+w close_window

# Font Resizing
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# Opacity Control (On-the-fly)
map ctrl+shift+u set_background_opacity +0.1
map ctrl+shift+d set_background_opacity -0.1

# Configuration Reload
map ctrl+shift+f5 load_config_file
