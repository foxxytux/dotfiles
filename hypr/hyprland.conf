# --- MONITORS ---
# Scaling set to 1.2
monitor = eDP-1, 1920x1080@60, 0x0, 1.2

# --- AUTOSTART ---
exec-once = wl-paste --type image --watch cliphist store
exec-once = mako
exec-once = ironbar
exec-once = hyprpaper

# --- INPUT ---
input {
    kb_layout = tr
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# Disable Touchpad
device {
    name = synps/2-synaptics-touchpad
    enabled = false
}

# --- VISUALS ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

group {
    col.border_active = rgba(33ccffee)
    groupbar {
        font_size = 10
        col.active = rgba(33ccffee)
        text_color = rgb(cdd6f4)
    }
}

# --- KEYBINDS ---
$mainMod = SUPER

# Apps
bind = $mainMod, Return, exec, kitty
bind = $mainMod, M, exec, wofi --show drun
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, F, togglefloating,
bind = $mainMod, J, togglegroup,

# THE EXIT COMMAND
bind = $mainMod SHIFT, Q, exit,

# Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6


bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# --- SCREENSHOTS ---
bind = , PRINT, exec, grim - | wl-copy
bind = SHIFT, PRINT, exec, bash -c 'area=$(slurp); grim -g "$area" - | wl-copy && grim -g "$area" ~/Pictures/Screenshots/screenshot_$(date +%s).png'

# --- MEDIA ---
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl set +10%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
