# ================================================================
# FOX-IFIED TMUX CONFIG
# ================================================================

# --- 1. QOL General Settings ---
set -g mouse on               # Enable mouse support
set -g history-limit 10000    # Increase scrollback buffer
set -g base-index 1           # Start window numbering at 1 (not 0)
set -g pane-base-index 1      # Start pane numbering at 1
set -g renumber-windows on    # Automatically renumber windows when one is closed
set -g escape-time 0          # No delay for escape key (huge for Vim users)
set -g display-time 2000      # Status messages last longer (2s)

# --- 2. Custom Keybinds (No Prefix Needed) ---
# Horizontal split with Ctrl + l
bind-key -n C-l split-window -v -c "#{pane_current_path}"

# Vertical split with Ctrl + j
bind-key -n C-j split-window -h -c "#{pane_current_path}"

# Switch focus using Ctrl + k
bind-key -n C-k select-pane -t :.+

# Alt + Arrow keys to resize panes (QOL)
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# --- 3. Fox-ify Visuals (Orange/Ginger Theme) ---

# Status bar colors
set -g status-style bg='#282a36',fg='#ffb86c' # Dark background, orange text

# Left side: Session name
set -g status-left '#[bg=#ffb86c,fg=#282a36,bold] 🦊 #S '

# Right side: Date and Time
set -g status-right '#[fg=#ffb86c]%Y-%m-%d #[fg=white]| #[fg=#ffb86c,bold]%H:%M '

# Active window tab
set-window-option -g window-status-current-style bg='#ffb86c',fg='#282a36',bold
set-window-option -g window-status-current-format ' #I:#W '

# Inactive window tabs
set-window-option -g window-status-style fg='#ffb86c'
set-window-option -g window-status-format ' #I:#W '

# Pane borders
set -g pane-border-style fg='#44475a'
set -g pane-active-border-style fg='#ffb86c'

# Message text
set -g message-style bg='#ffb86c',fg='#282a36',bold
set -g extended-keys on
set -g extended-keys-format csi-u
